<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🚀 Space Blaster</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      color: white;
      font-family: 'Courier New', Courier, monospace;
    }
    canvas {
      display: block;
      margin: auto;
      background: radial-gradient(circle at center, #111 0%, #000 100%);
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 20px;
    }
    #controls {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }
    #controls h3 {
      margin: 0 0 5px;
      font-size: 16px;
      color: #00ffff;
    }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <div id="controls">
    <h3>🎮 Controls</h3>
    ⬅️ ➡️ Move<br />
    ␣ Shoot
  </div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let keys = {};
    let bullets = [];
    let asteroids = [];

    const ship = {
      x: canvas.width / 2,
      y: canvas.height - 50,
      width: 40,
      height: 40,
      speed: 5
    };

    function drawShip() {
      ctx.fillStyle = 'cyan';
      ctx.beginPath();
      ctx.moveTo(ship.x, ship.y);
      ctx.lineTo(ship.x - ship.width / 2, ship.y + ship.height);
      ctx.lineTo(ship.x + ship.width / 2, ship.y + ship.height);
      ctx.closePath();
      ctx.fill();
    }

    function drawBullets() {
      ctx.fillStyle = 'yellow';
      bullets.forEach((b, i) => {
        ctx.fillRect(b.x, b.y, 4, 10);
        b.y -= 8;
        if (b.y < 0) bullets.splice(i, 1);
      });
    }

    function drawAsteroids() {
      ctx.fillStyle = 'red';
      asteroids.forEach((a, i) => {
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.radius, 0, Math.PI * 2);
        ctx.fill();
        a.y += a.speed;

        // Collision with ship
        if (
          a.y + a.radius > ship.y &&
          a.x > ship.x - ship.width / 2 &&
          a.x < ship.x + ship.width / 2
        ) {
          alert('💥 Game Over! Final Score: ' + score);
          document.location.reload();
        }

        // Collision with bullets
        bullets.forEach((b, j) => {
          if (
            b.x > a.x - a.radius &&
            b.x < a.x + a.radius &&
            b.y > a.y - a.radius &&
            b.y < a.y + a.radius
          ) {
            asteroids.splice(i, 1);
            bullets.splice(j, 1);
            score += 10;
            document.getElementById('score').textContent = 'Score: ' + score;
          }
        });

        if (a.y > canvas.height) asteroids.splice(i, 1);
      });
    }

    function spawnAsteroid() {
      const radius = Math.random() * 20 + 10;
      asteroids.push({
        x: Math.random() * canvas.width,
        y: -radius,
        radius: radius,
        speed: Math.random() * 2 + 1
      });
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawShip();
      drawBullets();
      drawAsteroids();

      if (keys['ArrowLeft'] && ship.x - ship.speed > ship.width / 2) ship.x -= ship.speed;
      if (keys['ArrowRight'] && ship.x + ship.speed < canvas.width - ship.width / 2) ship.x += ship.speed;

      requestAnimationFrame(update);
    }

    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ') {
        bullets.push({ x: ship.x, y: ship.y });
      }
    });

    document.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    setInterval(spawnAsteroid, 1000);
    update();
  </script>
</body>
</html>
